name: Update profile art

"on":
  schedule:
    - cron: "17 6 * * *"   # her gun ~06:17 UTC (TR saatiyle 09:17)
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: true

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Portre kutuphaneleri (pillow/numpy) gunluk isde gerekmiyor;
      # sadece scrape + cizim icin gerekenleri kur.
      - run: pip install "requests==2.32.3" "beautifulsoup4==4.12.3"

      - run: python scripts/fetch_contributions.py
      - run: python scripts/render_heatmap_svg.py

      # Commit'i acikca bot kimligiyle at. Aksi halde action, repodaki son
      # commit'in kimligini devraliyor ve gunluk tazeleme Emirhan'in katkisi
      # olarak sayiliyor - yani hic kod yazilmayan gunlerde bile grafikte
      # yesil kare cikiyor. Grafik gercek calismayi gostermeli.
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution graph [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
